
name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # 2. Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Linux dependencies
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 6. Install the exact Android packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      # 7. Configure Java
      - name: Configure Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      # 8. Configure Buildozer SDK path
      - name: Configure Buildozer SDK
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Creating Buildozer SDK:"
          echo "$BUILD_SDK"

          rm -rf "$BUILD_SDK"
          mkdir -p "$BUILD_SDK/tools/bin"

          # Buildozer 1.6 expects sdkmanager here.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -type f -name sdkmanager -print
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          ln -s "$SDKMANAGER" \
            "$BUILD_SDK/tools/bin/sdkmanager"

          # Link the installed Android SDK components.
          ln -s "$ANDROID_HOME/build-tools" \
            "$BUILD_SDK/build-tools"

          ln -s "$ANDROID_HOME/platforms" \
            "$BUILD_SDK/platforms"

          ln -s "$ANDROID_HOME/platform-tools" \
            "$BUILD_SDK/platform-tools"

          ln -s "$ANDROID_HOME/ndk" \
            "$BUILD_SDK/ndk"

          echo "Buildozer SDK prepared."

      # 9. Verify sdkmanager
      - name: Verify Buildozer SDK manager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          echo "$SDK"

          ls -l "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list > /dev/null

          echo "sdkmanager is working."

      # 10. Verify AIDL
      - name: Verify AIDL
        run: |
          AIDL="$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl"

          echo "Checking:"
          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not found."
            find "$ANDROID_HOME/build-tools" -type f -name aidl -print
            exit 1
          fi

          chmod +x "$AIDL"

          "$AIDL" --help > /dev/null || true

          echo "AIDL was found."

      # 11. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # 12. Verify Python and Buildozer
      - name: Verify Buildozer
        run: |
          python --version
          cython --version
          buildozer --version

      # 13. Configure buildozer.spec
      - name: Configure buildozer.spec
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit("ERROR: buildozer.spec was not found.")

          text = path.read_text()

          sdk = "/home/runner/.buildozer/android/platform/android-sdk"
          ndk = "/home/runner/.buildozer/android/platform/android-sdk/ndk/28.2.13676358"

          lines = text.splitlines()
          output = []

          sdk_done = False
          ndk_done = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.sdk_path"):
                  output.append(f"android.sdk_path = {sdk}")
                  sdk_done = True

              elif stripped.startswith("android.ndk_path"):
                  output.append(f"android.ndk_path = {ndk}")
                  ndk_done = True

              else:
                  output.append(line)

          if not sdk_done:
              output.append("")
              output.append("android.sdk_path = " + sdk)

          if not ndk_done:
              output.append("android.ndk_path = " + ndk)

          path.write_text("\n".join(output) + "\n")
          PY

          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      # 14. Clean old Buildozer state
      - name: Clean Buildozer state
        run: |
          buildozer android clean || true

          rm -rf .buildozer

      # 15. Recreate SDK links after clean
      - name: Recreate Buildozer SDK
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$BUILD_SDK/tools/bin"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          ln -sf "$SDKMANAGER" \
            "$BUILD_SDK/tools/bin/sdkmanager"

          ln -s "$ANDROID_HOME/build-tools" \
            "$BUILD_SDK/build-tools"

          ln -s "$ANDROID_HOME/platforms" \
            "$BUILD_SDK/platforms"

          ln -s "$ANDROID_HOME/platform-tools" \
            "$BUILD_SDK/platform-tools"

          ln -s "$ANDROID_HOME/ndk" \
            "$BUILD_SDK/ndk"

      # 16. Final SDK check
      - name: Final Android SDK check
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== SDK ====="
          ls -la "$SDK"
          echo "==============="

          echo "===== Build Tools ====="
          ls -la "$SDK/build-tools/35.0.0"
          echo "======================="

          echo "===== AIDL ====="
          test -f "$SDK/build-tools/35.0.0/aidl"
          echo "AIDL exists."
          echo "================"

          echo "===== SDK Manager ====="
          test -f "$SDK/tools/bin/sdkmanager"
          echo "sdkmanager exists."
          echo "======================="

      # 17. Build APK
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # 18. Find APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo "===================="

      # 19. Upload APK
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error


