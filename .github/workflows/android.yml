          fi

      - name: "Step 55: Create AIDL wrapper script"
        run: |
          echo "=== Creating AIDL wrapper script ==="
          SEARCH_PATH="${SDK_PATH:-$HOME/android-sdk}"
          WRAPPER_PATH="$SEARCH_PATH/cmdline-tools/latest/bin/aidl-wrapper"
          
          mkdir -p "$(dirname "$WRAPPER_PATH")" 2>/dev/null || true
          
          cat > "$WRAPPER_PATH" << 'AIDLWRAPPER'
          #!/bin/bash
          # AIDL wrapper script - searches multiple locations
          
          SEARCH_PATH="${SDK_PATH:-$HOME/android-sdk}"
          
          # Try to find and execute aidl from build-tools
          for version in 35.0.0 34.0.0 33.0.0 32.0.0 31.0.0; do
            AIDL="$SEARCH_PATH/build-tools/$version/aidl"
            if [ -f "$AIDL" ] && [ -x "$AIDL" ]; then
              exec "$AIDL" "$@"
            fi
          done
          
          echo "AIDL not found in any build-tools directory"
          exit 1
          AIDLWRAPPER
          
          echo "✓ AIDL wrapper script created at: $WRAPPER_PATH"

      - name: "Step 56: Add all AIDL search paths to PATH"
        run: |
          echo "=== Adding AIDL paths to PATH ==="
          SEARCH_PATH="${SDK_PATH:-$HOME/android-sdk}"
          
