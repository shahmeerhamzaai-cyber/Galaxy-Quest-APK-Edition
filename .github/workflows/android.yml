name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # 2. Setup Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Linux dependencies
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            build-essential

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
          else
            yes | sdkmanager --licenses > /dev/null || true
          fi

      # 6. Install Android SDK packages (ensure cmdline-tools present)
      - name: Install Android SDK packages
        run: |
          # pick sdkmanager binary shipped inside SDK if available
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi

          # ensure command-line tools are installed first, then required packages
          yes | "$SDKMANAGER" "cmdline-tools;latest" || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" || true

      # 7. Configure Android environment
      - name: Configure Android environment
        run: |
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT is not set. setup-android should provide it." >&2
            env | sort
            exit 1
          fi

          # Use ANDROID_SDK_ROOT consistently and set legacy vars expected by other tools
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          # put sdkmanager/aidl/build-tools/platform-tools on PATH
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      # 8. Configure Java 17
      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      # 9. Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version

      # 10. Verify SDK manager
      - name: Verify SDK manager
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -x "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

      # 11. Verify Android platform
      - name: Verify Android platform
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          echo "Android 35 platform found."

      # 12. Verify Build Tools
      - name: Verify Android Build Tools
        run: |
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "Android Build Tools 35.0.0 found."

      # 13. Verify AIDL
      - name: Verify AIDL
        run: |
          AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"
          echo "Checking AIDL: $AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not installed at $AIDL. Listing build-tools contents:"
            ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0" || true
            echo "Searching for aidl in SDK build-tools..."
            find "$ANDROID_SDK_ROOT/build-tools" -type f -name aidl -print || true
            find "$ANDROID_SDK_ROOT" -maxdepth 3 -type f -name aidl -print || true
            exit 1
          fi

          # ensure it is executable, attempt to chmod if needed
          if [ ! -x "$AIDL" ]; then
            echo "AIDL not executable; trying to chmod +x"
            chmod +x "$AIDL" || true
            if [ ! -x "$AIDL" ]; then
              echo "ERROR: AIDL not executable after chmod"
              ls -l "$AIDL"
              exit 1
            fi
          fi

          "$AIDL" --help > /dev/null
          echo "AIDL is working."

      # 14. Verify NDK
      - name: Verify Android NDK
        run: |
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -f "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties"
          echo "NDK source.properties:"
          cat "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties" || true
          echo "Android NDK is ready."

      # 15. Upgrade Python packaging tools
      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 16. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # 17. Verify Python and Buildozer
      - name: Verify Buildozer
        run: |
          python --version
          python -m pip --version
          cython --version
          buildozer --version

      # 18. Check project files
      - name: Check Galaxy Quest project
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec
          echo "=========================="

      # 19. Check main.py
      - name: Check main.py
        run: |
          if [ ! -f main.py ]; then
            echo "ERROR: main.py was not found."
            echo "Buildozer requires the source directory to contain main.py."
            exit 1
          fi
          echo "main.py found."

      # 20. Clean Buildozer state
      - name: Clean Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin
          echo "Buildozer cache cleaned."

      # 21. Verify environment after cleaning
      - name: Verify Build environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"
          echo "Build environment is ready."

      # 22. Show important tool versions
      - name: Show Android tools
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version || true
          else
            echo "sdkmanager not on PATH"
          fi
          if command -v aidl >/dev/null 2>&1; then
            aidl --help > /dev/null && echo "AIDL OK" || echo "AIDL check failed"
          else
            echo "aidl not on PATH (will try direct binary)"
            if [ -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" ]; then
              "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --help > /dev/null && echo "AIDL OK (direct)"
            else
              echo "AIDL not found"
            fi
          fi
          java -version || true
          python --version || true
          buildozer --version || true

      # 23. Build APK
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # 24. Check APK output
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print || true
          echo "===================="
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # 25. Upload APK
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error
