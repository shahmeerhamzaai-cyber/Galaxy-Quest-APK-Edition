name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python 3.12
      # --------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Linux dependencies
      # --------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            build-essential

      # --------------------------------------------------
      # 4. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Accept Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          # Prefer sdkmanager provided inside the SDK root to avoid PATH issues.
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
          else
            # Fallback to PATH
            yes | sdkmanager --licenses > /dev/null || true
          fi

      # --------------------------------------------------
      # 6. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      # --------------------------------------------------
      # 7. Configure Android environment
      # --------------------------------------------------
      - name: Configure Android environment
        run: |
          # setup-android uses ANDROID_SDK_ROOT; set ANDROID_HOME for legacy tools.
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          fi

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          # Add cmdline-tools/build-tools/platform-tools to PATH (prefer 'latest' if available)
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 8. Configure Java 17
      # --------------------------------------------------
      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Verify Java
      # --------------------------------------------------
      - name: Verify Java
        run: |
          java -version
          javac -version

      # --------------------------------------------------
      # 10. Verify SDK manager
      # --------------------------------------------------
      - name: Verify SDK manager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"

          if [ -x "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

      # --------------------------------------------------
      # 11. Verify Android platform
      # --------------------------------------------------
      - name: Verify Android platform
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android 35 platform found."

      # --------------------------------------------------
      # 12. Verify Build Tools
      # --------------------------------------------------
      - name: Verify Android Build Tools
        run: |
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android Build Tools 35.0.0 found."

      # --------------------------------------------------
      # 13. Verify AIDL
      # --------------------------------------------------
      - name: Verify AIDL
        run: |
          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"
          echo "Checking AIDL: $AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not installed at $AIDL. Listing build-tools contents:"
            ls -la "$ANDROID_HOME/build-tools/35.0.0" || true
            echo "Searching for aidl in SDK build-tools..."
            find "$ANDROID_HOME/build-tools" -type f -name aidl -print || true
            # As a last-ditch, check platform-tools/build-tools alternate locations
            find "$ANDROID_HOME" -maxdepth 3 -type f -name aidl -print || true
            exit 1
          fi

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL is not executable. File info:"
            ls -l "$AIDL"
            exit 1
          fi

          "$AIDL" --help > /dev/null
          echo "AIDL is working."

      # --------------------------------------------------
      # 14. Verify NDK
      # --------------------------------------------------
      - name: Verify Android NDK
        run: |
          echo "ANDROIDNDK=$ANDROIDNDK"
          test -d "$ANDROIDNDK"
          test -f "$ANDROIDNDK/source.properties"
          echo "NDK source.properties:"
          cat "$ANDROIDNDK/source.properties"
          echo "Android NDK is ready."

      # --------------------------------------------------
      # 15. Upgrade Python packaging tools
      # --------------------------------------------------
      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # --------------------------------------------------
      # 16. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # --------------------------------------------------
      # 17. Verify Python and Buildozer
      # --------------------------------------------------
      - name: Verify Buildozer
        run: |
          python --version
          python -m pip --version
          cython --version
          buildozer --version

      # --------------------------------------------------
      # 18. Check project files
      # --------------------------------------------------
      - name: Check Galaxy Quest project
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec
          echo "=========================="

      # --------------------------------------------------
      # 19. Check main.py
      # --------------------------------------------------
      - name: Check main.py
        run: |
          if [ ! -f main.py ]; then
            echo "ERROR: main.py was not found."
            echo "Buildozer requires the source directory to contain main.py."
            exit 1
          fi

          echo "main.py found."

      # --------------------------------------------------
      # 20. Clean Buildozer state
      # --------------------------------------------------
      - name: Clean Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin
          echo "Buildozer cache cleaned."

      # --------------------------------------------------
      # 21. Verify environment after cleaning
      # --------------------------------------------------
      - name: Verify Build environment
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"
          test -d "$ANDROIDSDK/platforms/android-35"
          test -d "$ANDROIDSDK/build-tools/35.0.0"
          test -f "$ANDROIDSDK/build-tools/35.0.0/aidl"

          command -v sdkmanager || true
          command -v aidl || true

          echo "Build environment is ready."

      # --------------------------------------------------
      # 22. Show important tool versions
      # --------------------------------------------------
      - name: Show Android tools
        run: |
          echo "===== SDK MANAGER ====="
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "sdkmanager not on PATH"
          fi

          echo "===== AIDL ====="
          if command -v aidl >/dev/null 2>&1; then
            aidl --help > /dev/null
            echo "AIDL OK"
          else
            echo "aidl not on PATH, trying direct binary..."
            if [ -x "$ANDROID_HOME/build-tools/35.0.0/aidl" ]; then
              "$ANDROID_HOME/build-tools/35.0.0/aidl" --help > /dev/null
              echo "AIDL OK (direct)"
            else
              echo "AIDL not found"
            fi
          fi

          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== BUILDOZER ====="
          buildozer --version

      # --------------------------------------------------
      # 23. Build APK
      # --------------------------------------------------
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 24. Check APK output
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo "===================="

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # --------------------------------------------------
      # 25. Upload APK
      # --------------------------------------------------
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error
