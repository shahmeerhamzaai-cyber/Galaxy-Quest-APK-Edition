          else
            echo "✗ APK not found!" | tee -a ~/build_logs/build.log
            echo "Directory contents:" | tee -a ~/build_logs/build.log
            ls -laR bin/ 2>/dev/null | tee -a ~/build_logs/build.log || true

            echo "Searching entire project:" | tee -a ~/build_logs/build.log
            find . -type f -name "*.apk" 2>/dev/null | tee -a ~/build_logs/build.log

            exit 1
          fi

      - name: "Step 72: Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: "Step 73: Upload build logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs-65Steps
          path: ~/build_logs/
          if-no-files-found: ignore

      - name: "Step 74: Generate build success report"
        if: success()
        run: |
          echo "========================================" > ~/build_logs/SUCCESS_REPORT.txt
          echo "✅ APK BUILD SUCCESSFUL ✅" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "========================================" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "Build Date: $(date)" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "Build Time: $(grep -o "Elapsed time.*" ~/build_logs/build_output.log | tail -1)" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "APK Details:" >> ~/build_logs/SUCCESS_REPORT.txt
          ls -lah bin/*.apk >> ~/build_logs/SUCCESS_REPORT.txt
          echo "" >> ~/build_logs/SUCCESS_REPORT.txt
          echo "65+ Build Steps Executed Successfully" >> ~/build_logs/SUCCESS_REPORT.txt
          cat ~/build_logs/SUCCESS_REPORT.txt
