name: Build Galaxy Quest APK - 65 Steps FIXED AIDL

on:
  workflow_dispatch:

jobs:
  build:
    name: Galaxy Quest APK - 65 Step Build (FIXED)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install essential build tools
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip curl wget




      - name: Install Android SDK Command Line Tools
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          echo "Downloading Android command-line tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O cmdline-tools.zip

          echo "Extracting..."

          rm -rf latest cmdline-tools
          unzip -q cmdline-tools.zip

          mv cmdline-tools latest

          echo "Checking sdkmanager..."

          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin"

          # Add to current step
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Add to future GitHub Actions steps
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Checking sdkmanager location..."

          which sdkmanager

          sdkmanager --version

          echo "Accepting Android licenses..."

          yes | sdkmanager --licenses || true

          echo "Installing Android platform tools..."

          sdkmanager "platform-tools"

          echo "Installing Android 35..."

          sdkmanager "platforms;android-35"

          echo "Installing Build Tools 35.0.0..."

          sdkmanager "build-tools;35.0.0"

          echo "Android SDK installation complete!"

          sdkmanager --version






      - name: Check existing Android SDK and AIDL
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"

          echo "Using SDK: $SDK"

          echo "Searching for AIDL..."

          AIDL=$(find "$SDK/build-tools" -type f -name aidl 2>/dev/null | sort -V | tail -1)

          if [ -n "$AIDL" ]; then
            echo "✅ AIDL found: $AIDL"

            echo "$(dirname "$AIDL")" >> "$GITHUB_PATH"
            echo "AIDL_PATH=$AIDL" >> "$GITHUB_ENV"

            echo "Testing AIDL..."
            "$AIDL" --help >/dev/null 2>&1

            if [ $? -eq 0 ]; then
              echo "✅ AIDL works"
            else
              echo "❌ AIDL exists but cannot run"
              exit 1
            fi
          else
            echo "❌ AIDL not found"
            exit 1
          fi

          echo "Searching for sdkmanager..."
          SDKMANAGER=$(find "$SDK/cmdline-tools" "$SDK/tools" \
            -type f -name sdkmanager 2>/dev/null | head -1)

          if [ -n "$SDKMANAGER" ]; then
            echo "✅ sdkmanager found: $SDKMANAGER"
          else
            echo "⚠️ sdkmanager not found, but AIDL is available"
          fi
      - name: "Install Python Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

          
      - name: Test AIDL
        run: |
          echo "AIDL_PATH=$AIDL_PATH"
          command -v aidl
          aidl --help >/dev/null 2>&1
          echo "✅ AIDL works"

      - name: Using Full AIDL Path
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --help >/dev/null 2>&1

          echo "✅ AIDL installed and working"
      - name: Cache Buildozer Android files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
            ~/android-sdk
          key: buildozer-android-${{ runner.os }}-v1
          restore-keys: |
            buildozer-android-${{ runner.os }}-
                  - name: Cache Buildozer Android files

      - name: Cache Buildozer Android files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
            ~/android-sdk
          key: buildozer-android-${{ runner.os }}-v1
          restore-keys: |
            buildozer-android-${{ runner.os }}-

      - name: Cache Buildozer Android files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
            ~/android-sdk
          key: buildozer-android-${{ runner.os }}-v1
          restore-keys: |
            buildozer-android-${{ runner.os }}-
      # ================================================================
      # SECTION 1: SYSTEM INITIALIZATION & DIAGNOSTICS (6 steps)
      # ================================================================

      - name: "Step 1: Display System Information"
        run: |
          echo "================================"
          echo "System Information"
          echo "================================"
          uname -a
          cat /etc/os-release | head -10
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep Mem)"
          df -h / | tail -1

      - name: "Step 2: Create build directories and logs"
        run: |
          mkdir -p ~/build_logs
          mkdir -p ~/backup_tools
          mkdir -p ~/android-sdk-backup
          mkdir -p ~/python_cache
          mkdir -p ~/java_test
          echo "Build directories created"

      - name: "Step 3: Display environment variables"
        run: |
          echo "Initial environment:"
          env | grep -E "PATH|HOME|JAVA|ANDROID|PYTHON" | sort
          echo "Total environment vars: $(env | wc -l)"

      - name: "Step 4: Check existing tools"
        run: |
          echo "=== Existing Tools Check ==="
          which java && java -version || echo "Java not found"
          which python3 && python3 --version || echo "Python not found"
          which git && git --version || echo "Git not found"
          which wget && wget --version | head -1 || echo "Wget not found"
          which curl && curl --version | head -1 || echo "Curl not found"

      - name: "Step 5: Test network connectivity"
        run: |
          echo "Testing network connectivity..."
          ping -c 3 google.com > /dev/null 2>&1 && echo "✓ Google DNS working"
          curl -I https://dl.google.com/android/repository/ --connect-timeout 5 > /dev/null 2>&1 && echo "✓ Google Android repo accessible" || echo "⚠ May need proxy"
          echo "Network test completed"

      - name: "Step 6: Set up logging system"
        run: |
          cat > ~/log_function.sh << 'LOGFUNC'
          #!/bin/bash
          log_step() {
            local step_num=$1
            local step_name=$2
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] Step $step_num: $step_name" | tee -a ~/build_logs/build.log
          }
          export -f log_step
          LOGFUNC
          echo "Logging system initialized"

      # ================================================================
      # SECTION 2: SYSTEM PACKAGE MANAGEMENT (6 steps)
      # ================================================================

  
        
      - name: "Step 10: Install system libraries part 1"
        run: |
          sudo apt-get install -y --no-install-recommends \
            libffi-dev libltdl-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libbz2-dev \
            libreadline-dev libsqlite3-dev > /dev/null 2>&1
          echo "✓ System libraries part 1 installed"

      - name: "Step 11: Install system libraries part 2"
        run: |
          sudo apt-get install -y --no-install-recommends \
            liblz4-dev libffi-dev libltdl7 libltdl-dev \
            libgdbm-dev libuuid1 uuid-dev > /dev/null 2>&1
          echo "✓ System libraries part 2 installed"

      - name: "Step 12: Install compression and archive tools"
        run: |
          sudo apt-get install -y --no-install-recommends \
            bzip2 xz-utils p7zip-full > /dev/null 2>&1
          echo "✓ Compression tools installed"

      # ================================================================
      # SECTION 3: JAVA INSTALLATION & CONFIGURATION (9 steps)
      # ================================================================
      - name: ⚡ Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          java-package: jdk
          check-latest: false

      - name: Verify JDK 11
        run: |
          echo "=== JDK 11 Verification ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Java location:"
          command -v java
          echo "Javac location:"
          command -v javac

      - name: "Step 16: Verify Java installation"
        run: |
          echo "=== Java Installation ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Java:"
          java -version
          echo "Javac:"
          javac -version
          echo "Java executable:"
          command -v java
          echo "Javac executable:"
          command -v javac
          echo "Java alternatives:"
          update-alternatives --list java 2>/dev/null || echo "No Java alternatives configured"
          echo "✅ Java installation verified"

      - name: "Step 17: Set Java 11 as primary"
        run: |
          java11_bin=$(find /usr/lib/jvm -name "java" -path "*/java-11-openjdk*/bin/java" | head -1)
          javac11_bin=$(find /usr/lib/jvm -name "javac" -path "*/java-11-openjdk*/bin/javac" | head -1)
          
          if [ -f "$java11_bin" ] && [ -f "$javac11_bin" ]; then
            sudo update-alternatives --install /usr/bin/java java "$java11_bin" 1 > /dev/null 2>&1
            sudo update-alternatives --install /usr/bin/javac javac "$javac11_bin" 1 > /dev/null 2>&1
            echo "✓ Java 11 set as default"
          else
            echo "✗ Java 11 binary not found, searching..."
            find /usr -name "java" -type f 2>/dev/null | head -5
          fi

      - name: "Step 18: Set JAVA_HOME environment variable"
        run: |
          java11_home=$(find /usr/lib/jvm -name "java-11-openjdk*" -type d | head -1)
          if [ -n "$java11_home" ]; then
            echo "JAVA_HOME=$java11_home" >> $GITHUB_ENV
            echo "JAVA_HOME is $java11_home"
            echo "✓ JAVA_HOME set"
          else
            echo "⚠ Java 11 home not found, using fallback"
            echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
          fi

      - name: "Step 19: Verify Java execution"
        run: |
          echo "=== Java Verification ==="
          java -version 2>&1
          javac -version 2>&1
          echo "JAVA_HOME: $JAVA_HOME"
          test -f "$JAVA_HOME/bin/java" && echo "✓ Java binary verified" || echo "✗ Java binary check failed"

      - name: "Step 20: Set Java compiler options"
        run: |
          echo "JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8" >> $GITHUB_ENV
          echo "JAVAC_OPTS=-Xms256m -Xmx2048m" >> $GITHUB_ENV
          echo "✓ Java compiler options configured"

      # ================================================================
      # SECTION 4: PYTHON SETUP & CONFIGURATION (6 steps)
      # ================================================================

      - name: "Step 21: Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Step 22: Verify Python installation"
        run: |
          echo "=== Python Verification ==="
          python --version
          python3 --version
          which python
          which python3
          python -c "import sys; print(f'Python executable: {sys.executable}')"
          echo "✓ Python verified"

      - name: "Step 23: Upgrade pip, setuptools, wheel"
        run: |
          python -m pip install --upgrade pip setuptools wheel > /dev/null 2>&1
          pip --version
          python -m pip --version
          echo "✓ Python tools upgraded"

      - name: "Step 24: Install Python build dependencies"
        run: |
          python -m pip install --upgrade \
            Cython==0.29.37 \
            virtualenv \
            requests \
            six \
            pexpect
          echo "✓ Python build dependencies installed"

      - name: "Step 25: Verify critical Python packages"
        run: |
          echo "=== Python Package Verification ==="
          python -c "import Cython; print(f'Cython: {Cython.__version__}')"
          python -c "import requests; print(f'requests: {requests.__version__}')"
          python -c "import six; print(f'six: {six.__version__}')"
          echo "✓ Python packages verified"

      - name: "Step 26: Create Python virtual environment (backup)"
        run: |
          python -m virtualenv ~/android_env > /dev/null 2>&1 || python -m venv ~/android_env
          echo "✓ Virtual environment created (as backup)"

      # ================================================================
      # SECTION 5: ANDROID SDK DIRECTORY PREPARATION (7 steps)
      # ================================================================

      - name: "Step 27: Create Android SDK root directory"
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/platforms"
          mkdir -p "$SDK_ROOT/build-tools"
          mkdir -p "$SDK_ROOT/ndk"
          mkdir -p "$SDK_ROOT/tools"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "✓ SDK directories created at $SDK_ROOT"

      - name: "Step 28: Verify SDK directory structure"
        run: |
          SDK_ROOT="$HOME/android-sdk"
          echo "=== SDK Directory Structure ==="
          tree -L 2 "$SDK_ROOT" 2>/dev/null || find "$SDK_ROOT" -type d
          du -sh "$SDK_ROOT"
          echo "✓ Directory structure verified"

      - name: "Step 29: Create backup directories"
        run: |
          mkdir -p "$HOME/android-sdk-backup"
          mkdir -p "$HOME/tools-backup"
          echo "✓ Backup directories created"

      - name: "Step 30: Set SDK environment variables"
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK=$HOME/android-sdk" >> $GITHUB_ENV
          echo "✓ SDK environment variables set"

      - name: "Step 31: Verify write permissions"
        run: |
          SDK_ROOT="$HOME/android-sdk"
          touch "$SDK_ROOT/test_write.tmp" && rm "$SDK_ROOT/test_write.tmp"
          if [ -w "$SDK_ROOT" ]; then
            echo "✓ Write permissions verified"
          else
            echo "✗ No write permissions, attempting to fix..."
            chmod -R 755 "$SDK_ROOT"
          fi

      - name: "Step 32: Set up cache directories"
        run: |
          mkdir -p ~/.gradle
          mkdir -p ~/.gradle/caches
          echo "org.gradle.jvmargs=-Xmx2048m" > ~/.gradle/gradle.properties
          echo "✓ Gradle cache configured"

      - name: "Step 33: Configure download manager"
        run: |
          echo "max_parallel_downloads=4" > "$HOME/android-sdk/download.conf"
          echo "✓ Download manager configured"

      # ================================================================
      # SECTION 6: CMDLINE-TOOLS INSTALLATION (9 steps)
      # ================================================================

      - name: "Step 34: Download cmdline-tools (primary)"
        run: |
          cd "$HOME/android-sdk/cmdline-tools"
          echo "Downloading cmdline-tools (primary URL)..."
          wget -q --timeout=30 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip 2>&1
          if [ -f tools.zip ]; then
            ls -lh tools.zip
            echo "✓ cmdline-tools downloaded (primary)"
          else
            echo "⚠ Primary download failed, trying alternative..."
          fi

      - name: "Step 35: Download cmdline-tools (fallback)"
        run: |
          cd "$HOME/android-sdk/cmdline-tools"
          if [ ! -f tools.zip ]; then
            echo "Attempting fallback download..."
            curl -L -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --connect-timeout 10 2>/dev/null
            if [ -f tools.zip ]; then
              ls -lh tools.zip
              echo "✓ cmdline-tools downloaded (fallback)"
            fi
          fi

      - name: "Step 36: Verify downloaded file"
        run: |
          cd "$HOME/android-sdk/cmdline-tools"
          if [ -f tools.zip ]; then
            file tools.zip
            unzip -t tools.zip > /dev/null 2>&1 && echo "✓ ZIP file is valid" || echo "⚠ ZIP file may be corrupted"
            ls -lh tools.zip
          else
            echo "✗ tools.zip not found - checking alternatives..."
            ls -la "$HOME/android-sdk/cmdline-tools/" || echo "Directory empty"
          fi

      - name: "Step 37: Extract cmdline-tools"
        run: |
          cd "$HOME/android-sdk/cmdline-tools"
          if [ -f tools.zip ]; then
            echo "Extracting cmdline-tools..."
            unzip -q tools.zip 2>&1 | head -20
            mkdir -p latest
            if [ -d cmdline-tools ]; then
              mv cmdline-tools/* latest/ 2>/dev/null
              rm -rf cmdline-tools
            fi
            echo "✓ cmdline-tools extracted"
          else
            echo "✗ ZIP file not found, cannot extract"
          fi

      - name: "Step 38: Set permissions on cmdline-tools"
        run: |
          ls -la "$HOME/android-sdk/cmdline-tools/latest/bin/" | head -20
          echo "✓ Permissions verified"

      - name: "Step 39: Create sdkmanager wrapper"
        run: |
          cat > "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager-wrapper" << 'WRAPPER'
          #!/bin/bash
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "$@"
          WRAPPER
          echo "✓ sdkmanager wrapper created"

      - name: "Step 40: Verify sdkmanager executable"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            file "$SDKMANAGER"
            test -x "$SDKMANAGER" && echo "✓ sdkmanager is executable" || echo "✗ Not executable"
          else
            echo "✗ sdkmanager not found at $SDKMANAGER"
          fi

      - name: "Step 41: Add cmdline-tools to PATH"
        run: |
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "✓ cmdline-tools added to PATH"

      - name: "Step 42: Test sdkmanager"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Testing sdkmanager..."
          $SDKMANAGER --version 2>&1 || echo "⚠ Version check may fail on first run"
          echo "✓ sdkmanager test completed"

      # ================================================================
      # SECTION 7: ANDROID SDK LICENSES & PACKAGES (8 steps)
      # ================================================================

      - name: "Step 43: Accept SDK licenses (attempt 1)"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting licenses (attempt 1)..."
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          echo "✓ License acceptance attempt 1 completed"

      - name: "Step 44: Accept SDK licenses (attempt 2)"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting licenses (attempt 2)..."
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          echo "✓ License acceptance attempt 2 completed"

      - name: "Step 45: Auto-accept all licenses"
        run: |
          mkdir -p "$HOME/.android"
          cat > "$HOME/.android/repositories.cfg" << 'REPOS'
          ### Android SDK Manager Settings ###
          ### Local file containing the network state of the SDK Manager ###
          REPOS
          echo "✓ Repositories config created"

      - name: "Step 46: Install platform-tools"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Installing platform-tools..."
          yes | $SDKMANAGER "platform-tools" > /dev/null 2>&1 || echo "⚠ Installation may be ongoing"
          sleep 5
          if [ -d "$HOME/android-sdk/platform-tools" ]; then
            echo "✓ platform-tools installed"
          fi

      - name: "Step 47: Install Android platforms"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Installing Android platforms..."
          yes | $SDKMANAGER "platforms;android-33" "platforms;android-34" "platforms;android-35" > /dev/null 2>&1 || echo "⚠ Installation ongoing"
          sleep 5
          ls -la "$HOME/android-sdk/platforms/" 2>/dev/null | head -10 || echo "Waiting for installation..."
          echo "✓ Platform installation initiated"

      - name: "Step 48: Install build-tools (versions 34-35)"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Installing build-tools..."
          yes | $SDKMANAGER "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null 2>&1 || echo "⚠ Installation ongoing"
          sleep 5
          ls -la "$HOME/android-sdk/build-tools/" 2>/dev/null || echo "Waiting for installation..."
          echo "✓ Build-tools installation initiated"

      - name: "Step 49: Install NDK"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Installing NDK..."
          yes | $SDKMANAGER "ndk;27.2.12479018" > /dev/null 2>&1 || echo "⚠ Installation ongoing"
          sleep 5
          ls -la "$HOME/android-sdk/ndk/" 2>/dev/null || echo "Waiting for NDK installation..."
          echo "✓ NDK installation initiated"

      - name: "Step 50: Install extras"
        run: |
          SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Installing extras..."
          yes | $SDKMANAGER "extras;android;m2repository" "extras;google;m2repository" > /dev/null 2>&1 || echo "⚠ Optional, may not be needed"
          echo "✓ Extras installation attempted"

      # ================================================================
      # SECTION 8: AIDL TOOL SETUP (CRITICAL - FIXED!) (8 steps)
      # ================================================================

      - name: "Step 51: Set SDK paths for AIDL search"
        run: |
          echo "=== Setting up AIDL search paths ==="
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "HOME: $HOME"
          
          # Define the correct SDK path (use env var if set, otherwise use default)
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$HOME/android-sdk"
          else
            SDK_PATH="$ANDROID_SDK_ROOT"
          fi
          
          echo "SDK_PATH: $SDK_PATH"
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "✓ SDK paths configured"

      - name: "Step 52: Search for AIDL in multiple locations"
        run: |
          echo "=== Searching for AIDL tool ==="
          
          # Use SDK_PATH if available, otherwise default
          if [ -n "$SDK_PATH" ]; then
            SEARCH_PATH="$SDK_PATH"
          else
            SEARCH_PATH="$HOME/android-sdk"
          fi
          
          echo "Searching in: $SEARCH_PATH"
          
          AIDL_FOUND=""
          
          # Search location 1: build-tools 35.0.0
          if [ -f "$SEARCH_PATH/build-tools/35.0.0/aidl" ]; then
            AIDL_FOUND="$SEARCH_PATH/build-tools/35.0.0/aidl"
            echo "✓ Found AIDL at: $AIDL_FOUND"
          fi
          
          # Search location 2: build-tools 34.0.0
          if [ -z "$AIDL_FOUND" ] && [ -f "$SEARCH_PATH/build-tools/34.0.0/aidl" ]; then
            AIDL_FOUND="$SEARCH_PATH/build-tools/34.0.0/aidl"
            echo "✓ Found AIDL at: $AIDL_FOUND"
          fi
          
          # Search location 3: build-tools 33.0.0
          if [ -z "$AIDL_FOUND" ] && [ -f "$SEARCH_PATH/build-tools/33.0.0/aidl" ]; then
            AIDL_FOUND="$SEARCH_PATH/build-tools/33.0.0/aidl"
            echo "✓ Found AIDL at: $AIDL_FOUND"
          fi
          
          # Search location 4: Any build-tools (find)
          if [ -z "$AIDL_FOUND" ] && [ -d "$SEARCH_PATH/build-tools" ]; then
            echo "Searching with find..."
            AIDL_FOUND=$(find "$SEARCH_PATH/build-tools" -name "aidl" -type f 2>/dev/null | sort -V | tail -1)
            if [ -n "$AIDL_FOUND" ]; then
              echo "✓ Found AIDL at: $AIDL_FOUND"
            fi
          fi
          
          # If still not found, list what we have
          if [ -z "$AIDL_FOUND" ]; then
            echo "✗ AIDL not found in standard locations"
            echo "Available build-tools versions:"
            ls -la "$SEARCH_PATH/build-tools/" 2>/dev/null || echo "build-tools directory not found"
            echo ""
            echo "Checking if build-tools exist at all..."
            find "$SEARCH_PATH" -name "build-tools" -type d 2>/dev/null
          else
            echo "AIDL_PATH=$AIDL_FOUND" >> $GITHUB_ENV
            echo "✓ AIDL path exported to environment"
          fi

      - name: "Step 53: Create AIDL symlink (primary method)"
        run: |
          echo "=== Creating AIDL symlinks ==="
          SEARCH_PATH="${SDK_PATH:-$HOME/android-sdk}"
          
          # Try to create symlink from 35.0.0
          AIDL_SRC="$SEARCH_PATH/build-tools/35.0.0/aidl"
          AIDL_DST="$SEARCH_PATH/cmdline-tools/latest/bin/aidl"
          
          if [ -f "$AIDL_SRC" ]; then
            mkdir -p "$(dirname "$AIDL_DST")" 2>/dev/null || true
            rm -f "$AIDL_DST" 2>/dev/null || true
            ln -s "$AIDL_SRC" "$AIDL_DST" 2>/dev/null || true
            
            if [ -L "$AIDL_DST" ] || [ -f "$AIDL_DST" ]; then
              echo "✓ AIDL symlink created (35.0.0)"
            fi
          fi

      - name: "Step 54: Create AIDL symlink (fallback method)"
        run: |
          echo "=== Creating AIDL fallback symlink ==="
          SEARCH_PATH="${SDK_PATH:-$HOME/android-sdk}"
          
          # Try to create symlink from 34.0.0 if 35 is not available
          AIDL_SRC="$SEARCH_PATH/build-tools/34.0.0/aidl"
          AIDL_DST="$SEARCH_PATH/cmdline-tools/latest/bin/aidl"
          
          if [ ! -f "$AIDL_DST" ] && [ -f "$AIDL_SRC" ]; then
            mkdir -p "$(dirname "$AIDL_DST")" 2>/dev/null || true
            ln -s "$AIDL_SRC" "$AIDL_DST" 2>/dev/null || true
            echo "✓ AIDL symlink created (34.0.0 fallback)"
