```yaml
name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python 3.12
      # --------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Java + Linux build dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # --------------------------------------------------
      # 4. Make Java 17 the active Java version
      # --------------------------------------------------
      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      # --------------------------------------------------
      # 5. Upgrade Python build tools
      # --------------------------------------------------
      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # --------------------------------------------------
      # 6. Install Buildozer + compatible Cython
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # --------------------------------------------------
      # 7. Verify Python / Cython / Buildozer
      # --------------------------------------------------
      - name: Verify build tools
        run: |
          python --version
          python -m pip --version
          cython --version
          buildozer --version

      # --------------------------------------------------
      # 8. Verify buildozer.spec
      # --------------------------------------------------
      - name: Check buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found!"
            exit 1
          fi

          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      # --------------------------------------------------
      # 9. Clean previous Buildozer state
      # --------------------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------------------------
      # 10. Build Galaxy Quest
      # --------------------------------------------------
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          if [ ! -d bin ]; then
            echo "ERROR: bin directory was not created!"
            exit 1
          fi

          find bin -type f -name "*.apk" -print

          echo "===================="

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error
```
