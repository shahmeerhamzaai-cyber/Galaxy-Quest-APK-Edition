name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find AIDL
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -type f -name "aidl" -print

      - name: Add AIDL to PATH
        run: |
          AIDL_PATH=$(find "$ANDROID_HOME" -type f -name "aidl" | head -n 1)
          if [ -z "$AIDL_PATH" ]; then
            echo "ERROR: AIDL was not found in Android SDK"
            exit 1
          fi
          echo "Found AIDL at: $AIDL_PATH"
          echo "$(dirname "$AIDL_PATH")" >> "$GITHUB_PATH"

      - name: Check AIDL
        run: |
          which aidl
          aidl --help

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

          - name: Accept Android SDK licenses
          run: |
          yes | sdkmanager --licenses || true

          - name: Install Android Build Tools
          run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0


      - name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.12"

    - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      python -m pip install buildozer cython

    - name: Build APK
      run: buildozer -v android debug  

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
