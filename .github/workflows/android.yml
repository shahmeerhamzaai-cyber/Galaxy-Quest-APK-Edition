name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python 3.12
      # --------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Linux dependencies
      # --------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo \
            wget

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------------------------
      # 6. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      # --------------------------------------------------
      # 7. Configure Android environment
      # --------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 8. Configure Java 17
      # --------------------------------------------------
      - name: Configure Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Verify Android installation
      # --------------------------------------------------
      - name: Verify Android installation
        run: |
          echo "================================"
          echo "ANDROID SDK"
          echo "================================"
          echo "$ANDROIDSDK"

          echo "================================"
          echo "ANDROID NDK"
          echo "================================"
          echo "$ANDROIDNDK"

          echo "================================"
          echo "SDKMANAGER"
          echo "================================"
          which sdkmanager
          sdkmanager --version

          echo "================================"
          echo "AIDL"
          echo "================================"

          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          test -f "$AIDL"

          "$AIDL" --help > /dev/null

          echo "AIDL OK"

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version
          javac -version

      - name: Verify AIDL
        run: |
          echo "Checking Android SDK..."
          sdkmanager --version

          echo "Checking AIDL..."
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help > /dev/null

          echo "AIDL is OK!"

      # --------------------------------------------------
      # 10. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # --------------------------------------------------
      # 11. Verify Python / Buildozer
      # --------------------------------------------------
      - name: Verify Buildozer
        run: |
          python --version
          python -m pip --version
          cython --version
          buildozer --version

      # --------------------------------------------------
      # 12. Check project
      # --------------------------------------------------
      - name: Check Galaxy Quest project
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== BUILD0ZER SPEC ====="

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found!"
            exit 1
          fi

          cat buildozer.spec

      # --------------------------------------------------
      # 13. Clean previous build
      # --------------------------------------------------
      - name: Clean previous Buildozer build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------------------------
      # 14. Verify environment used by Buildozer
      # --------------------------------------------------
      - name: Verify Buildozer environment
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"

          test -f "$ANDROIDSDK/build-tools/35.0.0/aidl"

          which sdkmanager
          which aidl

          echo "Build environment is ready."

      # --------------------------------------------------
      # 15. Build APK
      # --------------------------------------------------
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 16. Find APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo "===================="

      # --------------------------------------------------
      # 17. Upload APK
      # --------------------------------------------------
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error
