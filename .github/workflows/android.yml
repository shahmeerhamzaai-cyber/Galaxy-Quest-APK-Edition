name: Build Galaxy Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Galaxy Quest APK
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Download the repository
      # --------------------------------------------------
      - name: Checkout Galaxy Quest
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python 3.12
      # --------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Linux dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # --------------------------------------------------
      # 4. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Accept Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------------------------
      # 6. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      # --------------------------------------------------
      # 7. Configure Android environment
      # --------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Find AIDL
      # --------------------------------------------------
      - name: Find AIDL
        run: |
          echo "Searching for AIDL..."

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            -print

      # --------------------------------------------------
      # 9. Add AIDL to PATH
      # --------------------------------------------------
      - name: Configure AIDL
        run: |
          AIDL_PATH="$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL_PATH" ]; then
            echo "ERROR: AIDL was not found!"
            echo "Android SDK contents:"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "AIDL found:"
          echo "$AIDL_PATH"

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 10. Test Java
      # --------------------------------------------------
      - name: Check Java
        run: |
          java -version
          javac -version

      # --------------------------------------------------
      # 11. Test AIDL
      # --------------------------------------------------
      - name: Check AIDL
        run: |
          which aidl
          aidl --help > /dev/null
          echo "AIDL is working!"

      # --------------------------------------------------
      # 12. Upgrade pip tools
      # --------------------------------------------------
      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # --------------------------------------------------
      # 13. Install Buildozer + Cython
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.37"

      # --------------------------------------------------
      # 14. Verify Buildozer
      # --------------------------------------------------
      - name: Check Buildozer
        run: |
          python --version
          cython --version
          buildozer --version

      # --------------------------------------------------
      # 15. Show buildozer.spec
      # --------------------------------------------------
      - name: Check buildozer.spec
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      # --------------------------------------------------
      # 16. Copy Android SDK tools into Buildozer SDK
      # --------------------------------------------------
      - name: Install Buildozer Android SDK tools
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/build-tools"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/platforms"

          cp -r "$ANDROID_HOME/build-tools/35.0.0" \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/"

          cp -r "$ANDROID_HOME/platforms/android-35" \
            "$HOME/.buildozer/android/platform/android-sdk/platforms/"

      # --------------------------------------------------
      # 17. Verify Buildozer AIDL
      # --------------------------------------------------
      - name: Verify Buildozer AIDL
        run: |
          AIDL="$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: Buildozer AIDL is still missing!"
            exit 1
          fi

          chmod +x "$AIDL"
          "$AIDL" --help > /dev/null

          echo "Buildozer AIDL is working!"

      # --------------------------------------------------
      # 18. Build APK
      # --------------------------------------------------
      - name: Build Galaxy Quest APK
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 19. Show generated APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print
          echo "====================="

      # --------------------------------------------------
      # 20. Upload APK
      # --------------------------------------------------
      - name: Upload Galaxy Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyQuest-APK
          path: bin/*.apk
          if-no-files-found: error
